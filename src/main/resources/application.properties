#web访问端口
server.port=5050
#websocket
ws.port=5051
#前缀api
server.servlet.context-path=/api
#session过期时间
server.servlet.session.timeout=PT60M

#处理favicon
#spring.mvc.favicon.enabled=false
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

#错误页处理
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.datasource.url=jdbc:mysql://localhost:3306/easychat?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=HikariCPDatasource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

#Redis配置
spring.redis.database=0
spring.redis.host=127.0.0.1
spring.redis.port=6379
#最大连接数量
spring.redis.jedis.pool.max-active=20
#最大等待时间-无限制
spring.redis.jedis.pool.max-wait=-1
#最大等待空闲时间
spring.redis.jedis.pool.max-idle=10
#最小空闲连接数量
spring.redis.jedis.pool.min-idle=0
#连接超时时间
spring.redis.timeout=2000

#文件存储路径
project.folder=D:/JavaFile/IDEA_PROJECTS/easyChat/easychat-java/files/
#日志级别
log.root.level=debug
#管理员邮箱
admin.emails=t1@qq.com
#是否为开发环境
dev=false

#swagger??spring???
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
